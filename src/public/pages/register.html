<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>THE NEXUS BATTLE IV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .password-strength {
      height: 6px;
      border-radius: 3px;
      transition: all 0.3s ease;
    }
    .strength-weak { background-color: #dc3545; }
    .strength-medium { background-color: #ffc107; }
    .strength-strong { background-color: #28a745; }
    .form-floating .form-control:focus ~ label,
    .form-floating .form-control:not(:placeholder-shown) ~ label {
      opacity: .65;
      transform: scale(.85) translateY(-0.5rem) translateX(0.15rem);
    }
    .requirement {
      font-size: 0.875rem;
      transition: color 0.3s ease;
    }
    .requirement.met {
      color: #28a745;
    }
    .requirement.not-met {
      color: #dc3545;
    }
    .terms-link {
      color: #0d6efd;
      text-decoration: underline;
      cursor: pointer;
    }
    .terms-link:hover {
      color: #0b5ed7;
    }
    .terms-checkbox {
      margin-right: 8px;
    }
    .terms-text {
      font-size: 0.875rem;
      line-height: 1.4;
    }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">THE NEXUS BATTLE IV "A NEW HOPE"</span>
    </div>
  </nav>

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h4 class="card-title text-center mb-4">Crear cuenta</h4>
            
            <!-- Mensajes -->
            <div id="alertContainer"></div>
            
            <form id="registerForm">
              <!-- Nombres -->
              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="nombres" name="nombres" placeholder="Nombres" required>
                <label for="name">Nombres</label>
                <div class="invalid-feedback"></div>
              </div>

              <!-- Apellidos -->
              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="apellidos" name="apellidos" placeholder="Apellidos" required>
                <label for="apellidos">Apellidos</label>
                <div class="invalid-feedback"></div>
              </div>

              <!-- Apodo -->
              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="apodo" name="apodo" placeholder="Apodo" required>
                <label for="apodo">Apodo</label>
                <div class="invalid-feedback"></div>
              </div>

              <!-- Email -->
              <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" name="email" placeholder="correo@ejemplo.com" required>
                <label for="email">Correo electrónico</label>
                <div class="invalid-feedback"></div>
              </div>

              <!-- Contraseña -->
              <div class="form-floating mb-2">
                <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
                <label for="password">Contraseña</label>
                <div class="invalid-feedback"></div>
              </div>
              
              <!-- Barra de fuerza de contraseña -->
              <div class="password-strength mb-2" id="passwordStrength"></div>
              
              <!-- Requisitos de contraseña -->
              <div class="mb-3">
                <small class="text-muted">La contraseña debe cumplir:</small>
                <ul class="list-unstyled ms-3 mb-0">
                  <li class="requirement" id="req-length">
                    <i class="bi bi-x-circle"></i> Mínimo 8 caracteres
                  </li>
                  <li class="requirement" id="req-uppercase">
                    <i class="bi bi-x-circle"></i> Al menos una mayúscula
                  </li>
                  <li class="requirement" id="req-number">
                    <i class="bi bi-x-circle"></i> Al menos un número
                  </li>
                  <li class="requirement" id="req-special">
                    <i class="bi bi-x-circle"></i> Al menos un carácter especial
                  </li>
                </ul>
              </div>

              <!-- Confirmar contraseña -->
              <div class="form-floating mb-4">
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirmar contraseña" required>
                <label for="confirmPassword">Confirmar contraseña</label>
                <div class="invalid-feedback"></div>
              </div>

              <!-- Términos y condiciones -->
              <div class="mb-4">
                <div class="form-check">
                  <input class="form-check-input terms-checkbox" type="checkbox" id="acceptTerms" name="acceptTerms" required>
                  <label class="form-check-label terms-text" for="acceptTerms">
                    Acepto el 
                    <span class="terms-link" id="termsLink">tratamiento de mis datos personales</span>
                    y autorizo el uso de mi información de acuerdo con las políticas de privacidad de THE NEXUS BATTLE IV.
                  </label>
                  <div class="invalid-feedback">
                    Debes aceptar el tratamiento de datos para continuar.
                  </div>
                </div>
              </div>

              <div class="d-grid">
                <button class="btn btn-primary btn-lg" type="submit" id="submitBtn">
                  <span class="spinner-border spinner-border-sm d-none me-2" id="spinner"></span>
                  Registrarse
                </button>
              </div>
            </form>

            <div class="text-center mt-3">
              <small class="text-muted">
                ¿Ya tienes cuenta? 
                <a href="login.html" class="text-decoration-none">Inicia sesión aquí</a>
              </small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <script>
    const API = {
      register: (data) =>
        fetch('/api/usuarios/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        })
    };

    // Elementos del DOM
    const form = document.getElementById('registerForm');
    const alertContainer = document.getElementById('alertContainer');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const passwordStrength = document.getElementById('passwordStrength');
    const acceptTermsCheckbox = document.getElementById('acceptTerms');
    const termsLink = document.getElementById('termsLink');

    // Elementos de requisitos
    const requirements = {
      length: document.getElementById('req-length'),
      uppercase: document.getElementById('req-uppercase'),
      number: document.getElementById('req-number'),
      special: document.getElementById('req-special')
    };

    // Evento para abrir el PDF de tratamiento de datos
    termsLink.addEventListener('click', (e) => {
      e.preventDefault();
      // Abrir el PDF en una nueva pestaña
      // Asegúrate de que el PDF esté en la ruta correcta
      window.open('/assets/documents/tratamiento-datos.pdf', '_blank');
    });

    // Funciones de utilidad
    function showAlert(message, type = 'danger', errors = []) {
      let alertHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
          <strong>${message}</strong>
      `;
      
      if (errors && errors.length > 0) {
        alertHTML += '<ul class="mb-0 mt-2">';
        errors.forEach(error => {
          alertHTML += `<li>${error}</li>`;
        });
        alertHTML += '</ul>';
      }
      
      alertHTML += `
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      `;
      
      alertContainer.innerHTML = alertHTML;
    }

    function clearFieldErrors() {
      const fields = ['nombres', 'apellidos', 'apodo', 'email', 'password', 'confirmPassword', 'acceptTerms'];
      fields.forEach(field => {
        const input = document.getElementById(field);
        input.classList.remove('is-invalid');
        const feedback = input.nextElementSibling?.nextElementSibling;
        if (feedback && feedback.classList.contains('invalid-feedback')) {
          feedback.textContent = '';
        }
      });
    }

    function setFieldError(fieldId, message) {
      const input = document.getElementById(fieldId);
      input.classList.add('is-invalid');
      const feedback = input.nextElementSibling?.nextElementSibling;
      if (feedback && feedback.classList.contains('invalid-feedback')) {
        feedback.textContent = message;
      }
    }

    function updatePasswordRequirements(password) {
      const checks = {
        length: password.length >= 8,
        uppercase: /[A-Z]/.test(password),
        number: /[0-9]/.test(password),
        special: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password)
      };

      Object.keys(checks).forEach(key => {
        const element = requirements[key];
        const icon = element.querySelector('i');
        
        if (checks[key]) {
          element.classList.add('met');
          element.classList.remove('not-met');
          icon.className = 'bi bi-check-circle';
        } else {
          element.classList.add('not-met');
          element.classList.remove('met');
          icon.className = 'bi bi-x-circle';
        }
      });

      // Actualizar barra de fuerza
      const metCount = Object.values(checks).filter(Boolean).length;
      passwordStrength.className = 'password-strength mb-2';
      
      if (password.length === 0) {
        passwordStrength.style.width = '0%';
      } else if (metCount <= 1) {
        passwordStrength.classList.add('strength-weak');
        passwordStrength.style.width = '25%';
      } else if (metCount <= 2) {
        passwordStrength.classList.add('strength-weak');
        passwordStrength.style.width = '50%';
      } else if (metCount === 3) {
        passwordStrength.classList.add('strength-medium');
        passwordStrength.style.width = '75%';
      } else {
        passwordStrength.classList.add('strength-strong');
        passwordStrength.style.width = '100%';
      }
    }

    function validatePasswords() {
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;
      
      if (confirmPassword && password !== confirmPassword) {
        setFieldError('confirmPassword', 'Las contraseñas no coinciden');
        return false;
      } else if (confirmPassword) {
        document.getElementById('confirmPassword').classList.remove('is-invalid');
      }
      
      return true;
    }

    function validateTermsAcceptance() {
      if (!acceptTermsCheckbox.checked) {
        setFieldError('acceptTerms', 'Debes aceptar el tratamiento de datos para continuar');
        return false;
      }
      return true;
    }

    function setLoading(loading) {
      if (loading) {
        submitBtn.disabled = true;
        spinner.classList.remove('d-none');
        submitBtn.textContent = 'Registrando...';
      } else {
        submitBtn.disabled = false;
        spinner.classList.add('d-none');
        submitBtn.textContent = 'Registrarse';
      }
    }

    // Event listeners
    passwordInput.addEventListener('input', (e) => {
      updatePasswordRequirements(e.target.value);
      validatePasswords();
    });

    confirmPasswordInput.addEventListener('input', validatePasswords);

    acceptTermsCheckbox.addEventListener('change', () => {
      if (acceptTermsCheckbox.checked) {
        acceptTermsCheckbox.classList.remove('is-invalid');
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      alertContainer.innerHTML = '';
      clearFieldErrors();
      
      const formData = new FormData(form);
      const data = Object.fromEntries(formData);
      
      // Corregir el valor del checkbox
      data.acceptTerms = acceptTermsCheckbox.checked;
      
      // Validaciones del lado del cliente
      let isValid = true;
      
      if (!validatePasswords()) {
        isValid = false;
      }
      
      if (!validateTermsAcceptance()) {
        isValid = false;
      }
      
      if (!isValid) {
        return;
      }
      
      setLoading(true);
      
      try {
        const response = await API.register(data);
        const result = await response.json();
        
        if (response.ok) {
          showAlert('¡Registro exitoso! Bienvenido a The Nexus Battle IV.', 'success');
          form.reset();
          updatePasswordRequirements('');
          
          // Redirigir después de 2 segundos
          setTimeout(() => {
            window.location.href = '/pages/login.html';
          }, 2000);
          
        } else {
          showAlert(result.message || 'Error en el registro', 'danger', result.errors);
          
          // Mostrar errores específicos de campo si están disponibles
          if (result.errors) {
            result.errors.forEach(error => {
              if (error.includes('nombre')) {
                setFieldError('nombres', error);
              } else if (error.includes('apodo')) {
                setFieldError('apodo', error); 
              } else if (error.includes('correo') || error.includes('email')) {
                setFieldError('email', error);
              } else if (error.includes('contraseña') && !error.includes('coinciden')) {
                setFieldError('password', error);
              } else if (error.includes('coinciden')) {
                setFieldError('confirmPassword', error);
              }
            });
          }
        }
      } catch (error) {
        console.error('Error:', error);
        showAlert('Error de conexión. Inténtalo de nuevo.', 'danger');
      } finally {
        setLoading(false);
      }
    });

    // Inicializar
    updatePasswordRequirements('');
  </script>
</body>
</html>
